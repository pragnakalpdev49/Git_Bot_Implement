name: CI - Integration Test

# Controls when the action will run
on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]
  
  # Allow manual trigger
  workflow_dispatch:

# A workflow run is made up of one or more jobs
jobs:
  test:
    name: Run Tests with MongoDB
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11']
    
    # Note: Using MongoDB Atlas (cloud) instead of local MongoDB service
    # Connection string is provided via GitHub Secrets

    steps:
    # Step 1: Checkout code
    - name: 📥 Checkout repository
      uses: actions/checkout@v4

    # Step 2: Set up Python
    - name: 🐍 Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    # Step 3: Install dependencies
    - name: 📦 Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov pytest-mock coverage

    # Step 4: Create .env file for testing
    - name: ⚙️ Create .env file
      run: |
        echo "MONGO_STRING=${{ secrets.MONGO_STRING }}" > .env
        echo "DB_NAME=Processed-Orders" >> .env
        echo "COLLECTION_NAME=processed_orders" >> .env

    # Step 5: Verify MongoDB Atlas connection
    - name: 🔍 Verify MongoDB Atlas connection
      run: |
        echo "Testing MongoDB Atlas connection..."
        python -c "
        import pymongo
        import os
        from dotenv import load_dotenv
        load_dotenv()
        try:
            client = pymongo.MongoClient(os.getenv('MONGO_STRING'), serverSelectionTimeoutMS=5000)
            client.server_info()
            print('✅ Successfully connected to MongoDB Atlas!')
            client.close()
        except Exception as e:
            print(f'❌ Connection failed: {e}')
            exit(1)
        "

    # Step 6: Run unit tests
    - name: 🧪 Run unit tests
      run: |
        echo "Running unit tests..."
        python -m pytest test_fetch_data.py -v --tb=short
      continue-on-error: false

    # Step 8: Run integration tests
    - name: 🔗 Run integration tests
      run: |
        echo "Running integration tests..."
        python -m pytest test_integration.py -v --tb=short
      env:
        MONGO_STRING: ${{ secrets.MONGO_STRING }}
      continue-on-error: false

    # Step 9: Run tests with coverage
    - name: 📊 Run tests with coverage
      run: |
        echo "Running tests with coverage..."
        coverage run -m pytest test_fetch_data.py test_integration.py -v
        coverage report -m
        coverage xml
      env:
        MONGO_STRING: ${{ secrets.MONGO_STRING }}

    # Step 10: Upload coverage reports
    - name: 📤 Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

    # Step 11: Test the actual script
    - name: 🚀 Test fetch_data_from_mongo.py
      run: |
        echo "Testing the actual script..."
        
        # Insert test data into MongoDB Atlas using Python
        python -c "
        import pymongo
        import os
        from dotenv import load_dotenv
        from datetime import datetime
        
        load_dotenv()
        client = pymongo.MongoClient(os.getenv('MONGO_STRING'))
        db = client['Processed-Orders']
        collection = db['processed_orders']
        
        # Insert test document
        test_doc = {
            '_id': 'AI021438-001',
            'status': 'processed',
            'amount': 1000,
            'date': datetime.now()
        }
        collection.replace_one({'_id': 'AI021438-001'}, test_doc, upsert=True)
        print('✅ Test data inserted successfully!')
        client.close()
        "
        
        # Run the script
        python fetch_data_from_mongo.py
        
        # Verify it ran successfully
        if [ $? -eq 0 ]; then
          echo "✅ Script executed successfully!"
        else
          echo "❌ Script failed!"
          exit 1
        fi
      env:
        MONGO_STRING: ${{ secrets.MONGO_STRING }}

    # Step 12: Run linting
    - name: 🔍 Run code linting
      run: |
        pip install flake8 pylint
        echo "Running flake8..."
        flake8 fetch_data_from_mongo.py --max-line-length=100 --ignore=E501,W503 || true
        echo "Running pylint..."
        pylint fetch_data_from_mongo.py --disable=C0111,C0103 || true
      continue-on-error: true

    # Step 13: Security check
    - name: 🔒 Run security checks
      run: |
        pip install bandit safety
        echo "Running Bandit security scan..."
        bandit -r . -f json -o bandit-report.json || true
        bandit -r . || true
        echo "Running Safety check..."
        safety check || true
      continue-on-error: true

    # Step 14: Generate test report
    - name: 📋 Generate test report
      if: always()
      run: |
        echo "==================================="
        echo "Test Summary Report"
        echo "==================================="
        echo "Python Version: ${{ matrix.python-version }}"
        echo "MongoDB: Atlas (Cloud)"
        echo "Status: ${{ job.status }}"
        echo "==================================="

  # Job 2: Code Quality Checks
  code-quality:
    name: Code Quality & Style
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v4

    - name: 🐍 Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 📦 Install dependencies
      run: |
        pip install flake8 black isort mypy pylint

    - name: 🎨 Check code formatting (Black)
      run: |
        black --check fetch_data_from_mongo.py test_*.py || true
      continue-on-error: true

    - name: 📐 Check import sorting (isort)
      run: |
        isort --check-only fetch_data_from_mongo.py test_*.py || true
      continue-on-error: true

    - name: 🔍 Run flake8
      run: |
        flake8 fetch_data_from_mongo.py test_*.py --max-line-length=100 || true
      continue-on-error: true

    - name: 🔬 Run type checking (mypy)
      run: |
        mypy fetch_data_from_mongo.py --ignore-missing-imports || true
      continue-on-error: true

  # Job 3: Performance Testing
  performance:
    name: Performance Tests
    runs-on: ubuntu-latest
    
    # Note: Using MongoDB Atlas (cloud) for performance testing

    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v4

    - name: 🐍 Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 📦 Install dependencies
      run: |
        pip install -r requirements.txt
        pip install pytest pytest-benchmark

    - name: ⚡ Run performance tests
      run: |
        python test_integration.py TestMongoDBPerformance -v
      env:
        MONGO_STRING: ${{ secrets.MONGO_STRING }}

  # Job 4: Build Summary
  summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [test, code-quality, performance]
    if: always()
    
    steps:
    - name: 📊 Generate summary
      run: |
        echo "# 🎯 CI/CD Test Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Test Results" >> $GITHUB_STEP_SUMMARY
        echo "- **Integration Tests**: ${{ needs.test.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Code Quality**: ${{ needs.code-quality.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Performance**: ${{ needs.performance.result }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Build Information" >> $GITHUB_STEP_SUMMARY
        echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Triggered by**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
